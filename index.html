<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Partner</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#2874f0;color:white;padding:18px;text-align:center;font-size:25px;font-weight:bold}
.search{padding:15px}
input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 6px #ddd}
.card img{width:100%;height:130px;object-fit:contain}
.price{font-size:19px;font-weight:bold;margin:8px 0}
button{background:#2874f0;color:white;border:0;padding:10px;width:100%;border-radius:6px}
</style>
</head>
<body>

<header>🛍️ Apna Partner</header>

<div class="search">
<input type="text" placeholder="Product search karo...">
</div>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Smart Watch</h3>
<div class="price">₹999</div>
<button>🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Wireless Earbuds</h3>
<div class="price">₹799</div>
<button>🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Men's T-Shirt</h3>
<div class="price">₹499</div>
<button>🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Shoes</h3>
<div class="price">₹1,299</div>
<button>🛒 Cart me Add</button>
</div>

</div>

</body>
</html>
