<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Partner</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#2874f0;color:white;padding:18px;text-align:center;font-size:25px;font-weight:bold}
.search{padding:15px}
input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 6px #ddd}
.card img{width:100%;height:120px;object-fit:contain}
.price{font-size:19px;font-weight:bold;margin:8px 0}
button{background:#2874f0;color:white;border:0;padding:10px;width:100%;border-radius:6px}
#cart{background:white;margin:12px;padding:15px;border-radius:10px}
.cartitem{padding:8px 0;border-bottom:1px solid #ddd}
.remove{background:#e53935;width:auto;padding:6px 10px}
</style>
</head>

<body>

<header>🛍️ Apna Partner</header>

<div class="search">
<input type="text" placeholder="Product search karo...">
</div>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Smart Watch</h3>
<div class="price">₹999</div>
<button onclick="add('Smart Watch',999)">🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Wireless Earbuds</h3>
<div class="price">₹799</div>
<button onclick="add('Wireless Earbuds',799)">🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Men's T-Shirt</h3>
<div class="price">₹499</div>
<button onclick="add('Men T-Shirt',499)">🛒 Cart me Add</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Shoes</h3>
<div class="price">₹1299</div>
<button onclick="add('Shoes',1299)">🛒 Cart me Add</button>
</div>

</div>

<div id="cart">
<h2>🛒 Cart</h2>
<div id="items">Cart khali hai</div>
<h3 id="total">Total: ₹0</h3>
</div>

<script>
let cart=[];

function add(name,price){
cart.push({name,price});
showCart();
}

function removeItem(i){
cart.splice(i,1);
showCart();
}

function showCart(){
let items=document.getElementById("items");
let total=0;

if(cart.length===0){
items.innerHTML="Cart khali hai";
}else{
items.innerHTML="";
cart.forEach((item,i)=>{
total+=item.price;
items.innerHTML+=`
<div class="cartitem">
${item.name} — ₹${item.price}
<button class="remove" onclick="removeItem(${i})">Remove</button>
</div>`;
});
}

document.getElementById("total").innerText="Total: ₹"+total;
}
</script>

</body>
</html>
